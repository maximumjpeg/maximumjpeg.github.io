<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRON WALKER // MVP</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="crosshair">
      <div class="ch-line ch-h"></div>
      <div class="ch-line ch-v"></div>
      <div class="ch-dot"></div>
    </div>

    <div id="topbar">
      <div class="panel" id="ap-panel">
        <div class="label">AP</div>
        <div class="bar">
          <div class="fill" id="ap-fill"></div>
        </div>
      </div>
    </div>

    <div id="bottombar">
      <div class="panel" id="boost-panel">
        <div class="label">BOOST</div>
        <div class="bar">
          <div class="fill boost" id="boost-fill"></div>
        </div>
      </div>
      <div class="panel" id="weapon-panel">
        <div class="label">RIFLE</div>
        <div class="bar">
          <div class="fill heat" id="heat-fill"></div>
        </div>
      </div>
    </div>

    <div id="speed-readout">SPD <span id="speed-val">0</span></div>
    <div id="alt-readout">ALT <span id="alt-val">0</span></div>

    <div id="hitmarker"></div>
  </div>

  <div id="start-screen">
    <h1>IRON WALKER</h1>
    <p class="sub">S.P.A. MVP &mdash; Armored Core-style movement test</p>
    <div class="controls">
      <div><b>WASD</b> move</div>
      <div><b>Mouse</b> look / aim</div>
      <div><b>Shift</b> hold to boost</div>
      <div><b>Space</b> ascend (boost thrust)</div>
      <div><b>C</b> descend</div>
      <div><b>Left Click</b> fire rifle</div>
      <div><b>Esc</b> release mouse</div>
    </div>
    <button id="start-btn">CLICK TO ENGAGE</button>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
